<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Ícono de la app: expediente con cruz médica + micrófono (dictado).
       Cuadrado completo sin transparencia: iOS redondea las esquinas solo. -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D9BFF"/>
      <stop offset="1" stop-color="#0055D4"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#002a6b" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#fondo)"/>
  <!-- hoja del expediente -->
  <g filter="url(#sombra)">
    <rect x="262" y="214" width="500" height="616" rx="64" fill="#FFFFFF"/>
  </g>
  <!-- clip superior -->
  <rect x="402" y="178" width="220" height="92" rx="40" fill="#E6F0FF"/>
  <rect x="432" y="204" width="160" height="40" rx="20" fill="#0A6CFF"/>
  <!-- cruz médica -->
  <rect x="471" y="330" width="82" height="230" rx="22" fill="#0A6CFF"/>
  <rect x="397" y="404" width="230" height="82" rx="22" fill="#0A6CFF"/>
  <!-- renglones -->
  <rect x="342" y="620" width="340" height="30" rx="15" fill="#D3E3FB"/>
  <rect x="342" y="690" width="230" height="30" rx="15" fill="#D3E3FB"/>
  <!-- insignia de micrófono -->
  <circle cx="742" cy="760" r="132" fill="#FF3B30" stroke="#FFFFFF" stroke-width="22"/>
  <rect x="712" y="684" width="60" height="104" rx="30" fill="#FFFFFF"/>
  <path d="M682 754 a60 60 0 0 0 120 0" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>
  <rect x="733" y="812" width="18" height="34" rx="9" fill="#FFFFFF"/>
</svg>
