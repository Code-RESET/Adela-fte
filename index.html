<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Expediente Clínico — Dr. Armando de la Fuente</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
<meta name="color-scheme" content="light dark" />
<link rel="apple-touch-icon" href="assets/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<!-- "default": barra de estado del iPhone clara con texto oscuro; el contenido no queda debajo -->
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Expediente" />

<link rel="icon" href="assets/icon-192.png" />
<link rel="icon" type="image/svg+xml" href="assets/app-icon.svg" />
<!-- Sin fuentes externas: se usa la tipografía del sistema (San Francisco en iPhone). -->
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<!-- ===================== PANTALLA DE LOGIN ===================== -->
<section id="login-screen" class="screen">
  <div class="login-card">
    <img src="assets/dr-armando.jpg" alt="Dr. Armando Alejandro de la Fuente Escandón" class="login-foto" width="132" height="132" />
    <h1 class="login-title">Dr. Armando Alejandro de la Fuente Escandón</h1>
    <p class="login-especialidad">Ginecología y Obstetricia · Colposcopia</p>
    <p class="login-subtitle" id="app-name-slot">Expediente Clínico</p>

    <form id="login-form" autocomplete="off">
      <label class="field">
        <span>Correo</span>
        <input type="email" id="login-email" required autocomplete="username" />
      </label>
      <label class="field">
        <span>Contraseña</span>
        <input type="password" id="login-password" required autocomplete="current-password" />
      </label>
      <p id="login-error" class="error-text" hidden></p>
      <button type="submit" id="login-btn" class="btn-primary">Entrar</button>
    </form>

    <footer class="login-footer">
      <p>Desarrollado por: <strong>Ing. Luis Ángel Díaz Bernal</strong></p>
      <p>Compañía: <strong>CODE-RESET</strong></p>
    </footer>
  </div>
</section>

<!-- ===================== SHELL DE LA APP ===================== -->
<section id="app-shell" class="screen" hidden>
  <!-- Barra de navegación superior (estilo iOS) -->
  <header class="app-header">
    <span class="header-titulo">Expediente</span>
    <button id="logout-btn" class="btn-texto">Salir</button>
  </header>

  <main id="app-content" class="app-content">
    <!-- router.js inyecta aquí la vista activa -->
  </main>

  <!-- Barra de pestañas inferior (estilo iOS); router.js pinta las pestañas -->
  <nav id="app-nav" class="tab-bar" aria-label="Secciones"></nav>
</section>

<script type="module" src="js/router.js"></script>
<script type="module" src="js/auth.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(err => {
        console.warn('Service worker no registrado:', err);
      });
    });
  }
</script>
</body>
</html>
